# Regeneration path for the Xcode project.
#
# BrainrotAlarm.xcodeproj is checked in and opens directly. If it ever gets
# mangled, delete it and run `xcodegen generate` to rebuild an equivalent one.
name: BrainrotAlarm
options:
  bundleIdPrefix: com.oudomsak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BrainrotAlarm:
    type: application
    platform: iOS
    sources:
      - path: BrainrotAlarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oudomsak.brainrotalarm
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # The alarm has to keep chanting if you background the app mid-challenge.
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSAlarmKitUsageDescription: >-
          Brainrot Alarm needs alarm access so it can wake you even when your
          phone is silenced or in Focus.
        TARGETED_DEVICE_FAMILY: "1,2"

  BrainrotAlarmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrainrotAlarmTests
    dependencies:
      - target: BrainrotAlarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oudomsak.brainrotalarm.tests
        GENERATE_INFOPLIST_FILE: YES
