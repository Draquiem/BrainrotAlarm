name: build

# Compiles the app and runs the unit tests on a macOS runner.
#
# A simulator build needs no code signing and no Apple Developer account, so this
# works from a Linux machine with nothing but a GitHub token. It exists to answer
# the one question static analysis cannot: does it actually compile.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "--- available Xcodes ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          best = None
          for runtime, entries in sorted(devices.items()):
              if 'iOS' not in runtime:
                  continue
              for device in entries:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      best = (runtime, device['name'], device['udid'])
          if best is None:
              sys.exit('no iPhone simulator available on this runner')
          print(best[2])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -A2 -i ios | head -20

      - name: Show schemes and targets
        run: xcodebuild -project BrainrotAlarm.xcodeproj -list

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project BrainrotAlarm.xcodeproj \
            -scheme BrainrotAlarm \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project BrainrotAlarm.xcodeproj \
            -scheme BrainrotAlarm \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      - name: Launch it in the simulator and screenshot
        if: always()
        run: |
          set -x
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "BrainrotAlarm.app" -path "*Debug-iphonesimulator*" | head -1)
          echo "app bundle: $APP"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b || true
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" com.oudomsak.brainrotalarm || true
          mkdir -p /tmp/brainrot-shots
          for i in 1 2 3; do sleep 3; done
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot /tmp/brainrot-shots/app-alarms-tab.png || true
          ls -la /tmp/brainrot-shots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/brainrot-shots
          if-no-files-found: warn

      - name: Summarise problems
        if: always()
        run: |
          echo "### Errors" >> "$GITHUB_STEP_SUMMARY"
          grep -hE "error:|warning:.*(never used|unused|deprecated)" build.log test.log 2>/dev/null \
            | sort -u | head -80 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || echo "    none" >> "$GITHUB_STEP_SUMMARY"
          echo "### Test results" >> "$GITHUB_STEP_SUMMARY"
          grep -hE "Test Suite .* (passed|failed)|Executed [0-9]+ test" test.log 2>/dev/null \
            | tail -20 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore

  # The runner carries the iOS 26 SDK, so the AlarmKit path — written blind and
  # gated behind BRAINROT_ALARMKIT — can finally be type-checked. Non-blocking:
  # the app ships on the notification path regardless of what this says.
  alarmkit-probe:
    runs-on: macos-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build with BRAINROT_ALARMKIT enabled
        run: |
          set -o pipefail
          xcodebuild build \
            -project BrainrotAlarm.xcodeproj \
            -scheme BrainrotAlarm \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG BRAINROT_ALARMKIT" \
            2>&1 | tee alarmkit.log
      - name: AlarmKit API report
        if: always()
        run: |
          echo "## AlarmKit type-check against the real SDK" >> "$GITHUB_STEP_SUMMARY"
          if grep -q "error:" alarmkit.log; then
            grep -E "error:" alarmkit.log | sed "s|.*/BrainrotAlarm/||" | sort -u \
              | head -40 | sed "s/^/    /" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "    compiles clean - the AlarmKit path is real" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alarmkit-log
          path: alarmkit.log
          if-no-files-found: ignore
